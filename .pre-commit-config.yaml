# Run `pre-commit autoupdate` right after copying this file to pin the
# current hook versions — don't trust hardcoded revs in a template, they go
# stale silently.
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.20  # placeholder — run `pre-commit autoupdate`
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format

  - repo: https://github.com/executablebooks/mdformat
    rev: 1.0.0  # placeholder — run `pre-commit autoupdate`
    hooks:
      - id: mdformat
        additional_dependencies: [mdformat-gfm]

  # Local hooks: run mypy/biome in the project's real synced environment
  # rather than pre-commit's isolated venv (which misses third-party type
  # stubs and skips the JS toolchain entirely).
  - repo: local
    hooks:
      - id: mypy-lanterne
        name: mypy (lanterne)
        entry: uv run mypy packages/lanterne/src
        language: system
        pass_filenames: false
        types: [python]
      - id: mypy-api
        name: mypy (api)
        entry: uv run mypy services/api/src
        language: system
        pass_filenames: false
        types: [python]
      - id: biome-web
        name: biome (web)
        entry: bash -c 'cd services/web && pnpm run lint'
        language: system
        pass_filenames: false
        files: ^services/web/
