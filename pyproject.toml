[project]
name = "lanterne"
version = "0.1.0"
description = "Auto-hosted Telegram bot aggregating special screenings in Paris/IDF with TMDB enrichment."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.29.1",
    "aiosqlite>=0.22.1",
    "alembic>=1.18.5",
    "beautifulsoup4>=4.15.0",
    "httpx[http2]>=0.28.1",
    "instructor>=1.15.3",
    "openai>=2.44.0",
    "pydantic-settings>=2.14.2",
    "rich>=14.3.4",
    "sqlmodel>=0.0.39",
    "typer>=0.26.7",
]

# Console entry point: `uv run lanterne <command>` (scrape, stats, ...).
[project.scripts]
lanterne = "lanterne.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/lanterne"]

# Managed with uv: `uv sync` to install, `uv add <pkg>` / `uv add --dev <pkg>`
# to add a dependency — never edit this list by hand and forget `uv.lock`.
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "mypy",
    "mdformat",
    "mdformat-gfm",
    "pre-commit>=4.6.0",
]

# ---- Ruff: lint + format + imports + modernization, a single tool ----
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (dead code, unused imports)
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade (modern syntax)
    "B",        # bugbear (common bugs)
    "SIM",      # simplify
    "C90",      # cyclomatic complexity
    "ARG",      # unused arguments
    "RET",      # return consistency
    "PTH",      # pathlib rather than os.path
    "LOG",      # logging module best practices
    "D",        # pydocstyle (docstring presence + format)
    "TID",      # tidy-imports (bans relative imports)
    "ANN",      # flake8-annotations (missing type hints)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"__init__.py" = ["D104"]
# Alembic revision files are autogenerated: docstring style is not enforced and
# the template pre-imports the type modules revisions may or may not use.
"migrations/*" = ["D"]
"migrations/versions/*" = ["D", "F401"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"

# ---- Mypy (mandatory strict baseline, see rules/python/typing-strict.md) ----
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true


[tool.alembic]

# path to migration scripts.
# this is typically a path given in POSIX (e.g. forward slashes)
# format, relative to the token %(here)s which refers to the location of this
# ini file
script_location = "%(here)s/migrations"

# template used to generate migration file names; The default value is %%(rev)s_%%(slug)s
# Uncomment the line below if you want the files to be prepended with date and time
# see https://alembic.sqlalchemy.org/en/latest/tutorial.html#editing-the-ini-file
# for all available tokens
# file_template = "%%(year)d_%%(month).2d_%%(day).2d_%%(hour).2d%%(minute).2d-%%(rev)s_%%(slug)s"
# Or organize into date-based subdirectories (requires recursive_version_locations = true)
# file_template = "%%(year)d/%%(month).2d/%%(day).2d_%%(hour).2d%%(minute).2d_%%(second).2d_%%(rev)s_%%(slug)s"

# additional paths to be prepended to sys.path. defaults to the current working directory.
prepend_sys_path = [
    "."
]

# timezone to use when rendering the date within the migration file
# as well as the filename.
# If specified, requires the tzdata library which can be installed by adding
# `alembic[tz]` to the pip requirements.
# string value is passed to ZoneInfo()
# leave blank for localtime
# timezone =

# max length of characters to apply to the "slug" field
# truncate_slug_length = 40

# set to 'true' to run the environment during
# the 'revision' command, regardless of autogenerate
# revision_environment = false

# set to 'true' to allow .pyc and .pyo files without
# a source .py file to be detected as revisions in the
# versions/ directory
# sourceless = false

# version location specification; This defaults
# to <script_location>/versions.  When using multiple version
# directories, initial revisions must be specified with --version-path.
# version_locations = [
#    "%(here)s/alembic/versions",
#    "%(here)s/foo/bar"
# ]


# set to 'true' to search source files recursively
# in each "version_locations" directory
# new in Alembic version 1.10
# recursive_version_locations = false

# the output encoding used when revision files
# are written from script.py.mako
# output_encoding = "utf-8"

# This section defines scripts or Python functions that are run
# on newly generated revision scripts.  See the documentation for further
# detail and examples
# [[tool.alembic.post_write_hooks]]
# format using "black" - use the console_scripts runner,
# against the "black" entrypoint
# name = "black"
# type = "console_scripts"
# entrypoint = "black"
# options = "-l 79 REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# lint with attempts to fix using "ruff" - use the module runner, against the "ruff" module
# name = "ruff"
# type = "module"
# module = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"
#
# [[tool.alembic.post_write_hooks]]
# Alternatively, use the exec runner to execute a binary found on your PATH
# name = "ruff"
# type = "exec"
# executable = "ruff"
# options = "check --fix REVISION_SCRIPT_FILENAME"

