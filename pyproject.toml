[project]
name = "cine-event-bot"
version = "0.1.0"
description = "Auto-hosted Telegram bot aggregating special screenings in Paris/IDF with TMDB enrichment."
requires-python = ">=3.11"
dependencies = [
    "aiogram>=3.29.0",
    "aiosqlite>=0.22.1",
    "beautifulsoup4>=4.15.0",
    "httpx[http2]>=0.28.1",
    "instructor>=1.15.3",
    "openai>=2.44.0",
    "pydantic-settings>=2.14.2",
    "sqlmodel>=0.0.39",
    "typer>=0.26.7",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cine_event_bot"]

# Managed with uv: `uv sync` to install, `uv add <pkg>` / `uv add --dev <pkg>`
# to add a dependency — never edit this list by hand and forget `uv.lock`.
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "mypy",
    "mdformat",
    "mdformat-gfm",
    "pre-commit>=4.6.0",
]

# ---- Ruff: lint + format + imports + modernization, a single tool ----
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (dead code, unused imports)
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade (modern syntax)
    "B",        # bugbear (common bugs)
    "SIM",      # simplify
    "C90",      # cyclomatic complexity
    "ARG",      # unused arguments
    "RET",      # return consistency
    "PTH",      # pathlib rather than os.path
    "LOG",      # logging module best practices
    "D",        # pydocstyle (docstring presence + format)
    "TID",      # tidy-imports (bans relative imports)
    "ANN",      # flake8-annotations (missing type hints)
]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["D", "ANN"]
"__init__.py" = ["D104"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- Pytest ----
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-v --cov=src --cov-report=term-missing --cov-fail-under=80"

# ---- Mypy (mandatory strict baseline, see rules/python/typing-strict.md) ----
[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true
