# Workspace root — see docs/decisions/0015-uv-workspace-monorepo.md.
#
# This file is not itself an installable package (`tool.uv.package = false`):
# it only declares the workspace members and holds the shared dev-tooling
# baseline (ruff, mypy) every member extends. Each member (packages/lanterne,
# services/api, ...) has its own [project] table with its own dependencies.
[project]
name = "lanterne-workspace"
version = "0.1.0"
description = "Lanterne monorepo — workspace root, not an installable package."
requires-python = ">=3.11"
dependencies = []

[tool.uv]
package = false

[tool.uv.workspace]
members = ["packages/*", "services/api"]

# Managed with uv: `uv sync --all-groups` at the repo root installs every
# workspace member into one shared environment (see docs/decisions/0015).
[dependency-groups]
dev = [
    "ruff",
    "pytest",
    "pytest-cov",
    "pytest-asyncio",
    "testcontainers[postgres]",
    "mypy",
    "mdformat",
    "mdformat-gfm",
    "pre-commit>=4.6.0",
]

# ---- Ruff: shared baseline every workspace member extends via
# `[tool.ruff] extend = "../../pyproject.toml"` (see rules/common/config-standards.md
# — extend, never duplicate). Member-specific per-file-ignores live in the
# member's own pyproject.toml. ----
[tool.ruff]
line-length = 88
target-version = "py311"

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes (dead code, unused imports)
    "I",        # isort (import sorting)
    "N",        # pep8-naming
    "UP",       # pyupgrade (modern syntax)
    "B",        # bugbear (common bugs)
    "SIM",      # simplify
    "C90",      # cyclomatic complexity
    "ARG",      # unused arguments
    "RET",      # return consistency
    "PTH",      # pathlib rather than os.path
    "LOG",      # logging module best practices
    "D",        # pydocstyle (docstring presence + format)
    "TID",      # tidy-imports (bans relative imports)
    "ANN",      # flake8-annotations (missing type hints)
]
ignore = []

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---- Mypy (mandatory strict baseline, see rules/python/typing-strict.md) ----
# Shared across every member: mypy reads pyproject.toml from its invocation
# directory (it does not walk up like ruff), so every CI/dev invocation runs
# `uv run mypy <paths>` from the repo root to pick up this section.
[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
warn_return_any = true
warn_unused_ignores = true
warn_unused_configs = true
ignore_missing_imports = true

# numpy's own stubs (a transitive dependency of shapely, itself pulled in
# for geoalchemy2 — see docs/decisions/0022-postgres-extensions.md) use
# Python 3.12+ syntax (the `type X = ...` statement) that mypy can't parse
# under this project's python_version = "3.11" target. Skip following
# numpy's stubs rather than lowering the whole project's target for a
# dependency the app code never imports directly.
[[tool.mypy.overrides]]
module = ["numpy.*"]
follow_imports = "skip"
