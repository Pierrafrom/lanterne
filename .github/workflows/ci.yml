# Mirrors the local quality gate: ruff + mypy + pytest (Python), biome +
# tsc + build (web) — same tools as .pre-commit-config.yaml, so CI never
# disagrees with what a local commit enforced.
name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --all-groups

      - name: Lint (ruff)
        run: uv run ruff check .

      - name: Format check (ruff)
        run: uv run ruff format --check .

      - name: Type check lanterne (mypy --strict)
        run: uv run mypy packages/lanterne/src

      - name: Type check api (mypy --strict)
        run: uv run mypy services/api/src

      - name: Tests — lanterne (real PostgreSQL via testcontainers)
        run: uv run --directory packages/lanterne pytest

      - name: Tests — api
        run: uv run --directory services/api pytest

  web-quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/web
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6
        with:
          version: 11

      - uses: actions/setup-node@v5
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: services/web/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint + format check (biome)
        run: pnpm run lint

      - name: Type check (tsc)
        run: pnpm run typecheck

      - name: Build
        run: pnpm run build
