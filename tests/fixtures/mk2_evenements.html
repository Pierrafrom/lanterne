<html><body><script>self.__next_f.push([1,"8:3:[{\"slug\":\"avant-premieres-avec-equipe\",\"type\":\"event-list\",\"title\":\"AVANT-PREMIÈRES AVEC ÉQUIPE\",\"events\":[{\"name\":\"L'Écologie des sentiments\",\"slug\":\"l-ecologie-des-sentiments\",\"type\":{\"id\":\"avant-premiere\",\"name\":\"Avant-première\",\"color\":\"#f4474c\"},\"genres\":[{\"id\":\"equipe-du-film\",\"name\":\"Équipe du film\"}],\"description\":\"Félix, un jeune homme timide et fantasque, travaille en tant que réceptionniste dans un petit hôtel parisien tenu par son père. Lorsque Lola, une jeune femme énigmatique, s’installe à l’hôtel, son petit monde se retrouve totalement chamboulé. Découvrez en avant-première le film \\\"L'Écologie des sentiments\\\" le mardi 7 juillet à 20h00 au mk2 Quai de Seine ! La séance sera présentée par le réalisateur Alexandre Steiger et les acteurs Andranic Manet, Salomé Rose Stein et Abraham Wapler. \",\"nextSession\":{\"cinemaId\":\"0011\",\"showTime\":\"2026-07-07T18:00:00.000Z\"},\"linkedCinemas\":[{\"id\":\"0011\",\"name\":\"quai de seine\"}]}]},{\"slug\":\"avant-premieres-et-seances-exclusives\",\"type\":\"event-list\",\"title\":\"AVANT-PREMIÈRES ET SÉANCES EXCLUSIVES\",\"events\":[{\"name\":\"Festival : 10 ans de labels mk2 !\",\"slug\":\"festival-10-ans-de-labels-mk2\",\"type\":{\"id\":\"festival\",\"name\":\"Festival\",\"color\":\"#f4474c\"},\"genres\":[],\"description\":\"Les labels mk2 fêtent leurs 10 ans ! A cette occasion, (re)découvrez 15 films labellisés au mk2 Parnasse, à partir du mecredi 15 juillet. \",\"nextSession\":{\"cinemaId\":\"0010\",\"showTime\":\"2026-07-15T12:00:00.000Z\"},\"linkedCinemas\":[{\"id\":\"0010\",\"name\":\"parnasse\"}]}]},{\"slug\":\"cinema-clubs\",\"type\":\"event-list\",\"title\":\"CINÉMA CLUBS\",\"events\":[{\"name\":\"Cultissime\",\"slug\":\"cinema-club-cultissime\",\"type\":{\"id\":\"cinema-club\",\"name\":\"Cinéma club\",\"color\":\"#F4474C\"},\"genres\":[{\"id\":\"grands-classiques\",\"name\":\"Grands classiques\"}],\"description\":\"Vous avez toujours eu envie de les voir ? Vous voulez les revoir sur grand écran ? Les faire découvrir à vos proches ? C’est l’occasion d’aller au cinéma club Cultissime !\\n(Re)découvrez une sélection de films cultes sur grand écran ayant marqué l’histoire du cinéma et réédités en numérique. De la comédie romantique au film de gangster, du film d’horreur au drame, le programme Cultissime saura enchanter vos week-ends.\",\"nextSession\":{\"cinemaId\":\"0004\",\"showTime\":\"2026-07-12T18:00:00.000Z\"},\"linkedCinemas\":[{\"id\":\"0004\",\"name\":\"bibliothèque\"},{\"id\":\"0006\",\"name\":\"gambetta\"},{\"id\":\"0009\",\"name\":\"odéon st-michel\"},{\"id\":\"0010\",\"name\":\"parnasse\"}]}]},{\"slug\":\"cycles-de-conferences\",\"type\":\"event-list\",\"title\":\"CYCLES DE CONFÉRENCES\",\"events\":[{\"name\":\"Voyage au ventre du monde – Le cycle de conférences de Aïtor Alfonso\",\"slug\":\"voyage-au-ventre-du-monde-le-cycle-de-conferences-de-aitor-alfonso-mk2-institut\",\"type\":{\"id\":\"conferences\",\"name\":\"Conférences\",\"color\":\"#F4474C\"},\"genres\":[{\"id\":\"societe\",\"name\":\"Société\"}],\"description\":\"Les aliments ne nourrissent jamais seulement les corps. Ils véhiculent des récits, des valeurs, des croyances et des représentations qui permettent aux sociétés de se penser elles-mêmes. À travers ce que l'on mange, ce que l'on refuse de manger, la manière dont on prépare ou partage les repas, se dessinent des appartenances collectives, des hiérarchies sociales, des visions du monde et des rapports de pouvoir.\\n\\nAvec ce cycle de conférences qui allie plaisir et savoir, l'auteur et journaliste culinaire Aïtor Alfonso (connu sous le pseudo @saucegribiche sur les réseaux sociaux) explore - non sans humour - ce système de sens qui façonnent nos identités, nos imaginaires et nos manières de vivre ensemble.\",\"nextSession\":{\"cinemaId\":\"0006\",\"showTime\":\"2026-10-06T17:00:00.000Z\"},\"linkedCinemas\":[{\"id\":\"0006\",\"name\":\"gambetta\"}]}]}]"])</script></body></html>
